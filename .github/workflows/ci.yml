name: CI

run-name: "CI: ${{ github.event.pull_request.title || github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-matrix:
    name: Resolve Ultralytics compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matrix tooling
        run: python -m pip install packaging pytest

      - name: Test matrix selection
        run: python -m pytest -q .github/tests/test_ultralytics_matrix.py

      - name: Resolve lowest and highest permitted releases
        id: matrix
        run: |
          matrix="$(python .github/scripts/ultralytics_matrix.py --python-versions 3.10 3.11 3.12 3.13)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: "Test: Python ${{ matrix.python-version }} | Ultralytics ${{ matrix.ultralytics-version }} (${{ matrix.ultralytics-profile == 'lowest' && 'min' || matrix.ultralytics-profile == 'highest' && 'latest' || 'min/latest' }})"
    needs: dependency-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dependency-matrix.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' 'ultralytics==${{ matrix.ultralytics-version }}'

      - name: Verify resolved dependencies
        run: |
          python -m pip show ultralytics
          python -m pip check

      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build and validate distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv artifact-venv
          artifact-venv/bin/python -m pip install --upgrade pip
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          artifact-venv/bin/python -m pip install "$wheel_path"
          artifact-venv/bin/python -m pip check
          artifact-venv/bin/python -c 'import ml_pipes.ultralytics'

  compatibility-summary:
    # Keep this check name stable for GitHub's required status checks.
    name: Upstream compatibility
    needs: [dependency-matrix, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all compatibility jobs succeeded
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.dependency-matrix.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          printf 'Matrix resolution: %s\nCompatibility tests: %s\n' \
            "$MATRIX_RESULT" "$TEST_RESULT"
          for result in "$MATRIX_RESULT" "$TEST_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::All compatibility jobs must succeed; failed, cancelled, or skipped jobs are not accepted."
              exit 1
            fi
          done
