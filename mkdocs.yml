site_name: ml-pipes-ultralytics
site_description: Ultralytics YOLO capabilities as composable ml-pipes operators.
site_url: https://trained-by-humans.github.io/ml-pipes-ultralytics/
repo_name: ml-pipes-ultralytics

theme:
  name: material
  font:
    text: Inter
    code: IBM Plex Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Learn:
      - Detect and Crop: tutorials/detect_and_crop.md
      - Segment and Annotate: tutorials/segment_and_annotate.md
      - Blur People: tutorials/object_blurrer.md
      - Detect Objects on Video: tutorials/detection_video.md
      - Track Objects on Video: tutorials/track_objects.md
  - Reference: reference.md
  - Coverage: coverage.md

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
