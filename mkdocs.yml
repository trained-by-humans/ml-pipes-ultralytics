site_name: ml-pipes-ultralytics
site_description: Ultralytics YOLO capabilities as composable ml-pipes operators.
site_url: https://ultralytics.ml-pipes.com/
repo_name: ml-pipes-ultralytics

theme:
  name: pixel-lab
  footer_text: Build explicit ML pipelines
  header_background: "linear-gradient(105deg, #111F68 0%, #042AFF 45%, #76FFD6 100%)"
  accent_color: "#09DBF0"
  accent_dark_color: "#0B23A9"
  accent_foreground_color: "#FFFFFF"

extra:
  analytics:
    provider: google
    measurement_id: G-CE2N1XKFVT
    consent_domain: ml-pipes.com
    privacy_policy: https://ml-pipes.com/privacy/

nav:
  - Home: index.md
  - Learn:
      - Detect and Crop: tutorials/detect_and_crop.md
      - Segment and Annotate: tutorials/segment_and_annotate.md
      - Blur People: tutorials/object_blurrer.md
      - Detect Objects on Video: tutorials/detection_video.md
      - Track Objects on Video: tutorials/track_objects.md
  - Reference: reference.md
  - Coverage: coverage.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
