[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-pipes-ultralytics"
version = "0.1.2rc1"
description = "Ultralytics YOLO operators for ml-pipes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
keywords = ["computer-vision", "ml-pipes", "ultralytics", "yolo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "ml-pipes-core==0.1.2rc1",
    "ml-pipes-vision==0.1.2rc1",
    "ultralytics>=8.4.143",
]

[project.urls]
Homepage = "https://trained-by-humans.github.io/ml-pipes-ultralytics/"
Documentation = "https://trained-by-humans.github.io/ml-pipes-ultralytics/"
Repository = "https://github.com/trained-by-humans/ml-pipes-ultralytics"
Issues = "https://github.com/trained-by-humans/ml-pipes-ultralytics/issues"
Changelog = "https://github.com/trained-by-humans/ml-pipes-ultralytics/releases"

[project.optional-dependencies]
test = ["pytest>=8"]
docs = [
    "mike>=2.1",
    "mkdocs-material>=9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipes"]

[tool.hatch.build.targets.sdist]
include = ["LICENSE.txt", "README.md", "examples", "pyproject.toml", "src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
